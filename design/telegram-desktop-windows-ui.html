<style>

.button {

.toggle { width: 40px; height: 20px; border: 1px solid var(--border-strong); background: var(--surface-alt); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--muted); transition: transform .15s, background .15s; }
.toggle-row input:checked + .toggle { background: var(--accent); border-color: var(--accent); }
.toggle-row input:checked + .toggle::after { transform: translateX(20px); background: #fff; }
.toggle-row input:focus-visible + .toggle { outline: 2px solid var(--accent); outline-offset: 2px; }
.shortcut-list { margin: 0; padding: 0; }
.shortcut-list > div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.shortcut-list > div:last-child { border-bottom: 0; }
.shortcut-list dt { color: var(--muted); }
.shortcut-list dd { margin: 0; }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--border-strong); background: var(--surface-alt); padding: 1px 5px; }

.modal-layer {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, .45);
  z-index: 100;
}
.modal-layer.is-open { display: flex; }
.modal {
  width: min(520px, 100%);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-deep);
}
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: var(--dark); color: #fff; }
.modal-title { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 300; }
.modal-close { margin-left: auto; width: 36px; height: 36px; border: 0; background: transparent; color: #fff; display: grid; place-items: center; }
.modal-close:hover { background: rgba(255, 255, 255, .12); }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
.field-label { display: block; margin: 0 0 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.field { width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--border); background: var(--surface-alt); font-size: 14px; }
.field:focus { outline: none; border-color: var(--accent); background: var(--surface); }
textarea.field { height: auto; min-height: 76px; padding: 9px 10px; resize: vertical; }
.field-error { min-height: 18px; margin-top: 5px; color: var(--danger); font-size: 12px; }

.toast {
  position: absolute;
  top: 14px; right: 14px;
  width: 340px;
  max-width: calc(100% - 28px);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-deep);
  z-index: 110;
  display: none;
}
.toast.is-visible { display: block; animation: toastIn .2s var(--ease); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.toast-head { display: flex; align-items: center; gap: 9px; padding: 11px 11px 0; }
.toast-avatar { width: 28px; height: 28px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
.toast-title { font-size: 13px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast-close { margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.toast-close:hover { background: var(--surface-alt); color: var(--fg); }
.toast-body { padding: 5px 11px 10px; font-size: 12px; color: var(--muted); }
.toast-actions { display: flex; gap: 8px; padding: 0 11px 11px; }

.state-menu {
  position: absolute;
  top: calc(var(--header-h) + 6px);
  left: 8px;
  width: 236px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-deep);
  z-index: 130;
  display: none;
}
.state-menu.is-open { display: block; }
.state-menu-head { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.state-menu button { width: 100%; padding: 9px 12px; border: 0; background: transparent; text-align: left; font-size: 13px; }
.state-menu button:hover { background: var(--surface-alt); }

.splash {
  position: absolute;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: var(--accent);
  color: #fff;
  transition: opacity .3s var(--ease), visibility .3s;
}
.splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
html.clean .splash { display: none !important; }
.splash-mark svg { width: 79.2px; height: 79.2px; }
.splash-title { font-family: var(--font-display); font-size: 42px; font-weight: 300; }
.splash-sub { font-size: 12px; opacity: .82; }
.splash-bar { width: 160px; height: 2px; margin-top: 6px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.splash-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #fff; animation: loadbar 1.2s ease forwards; }
@keyframes loadbar { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border: 2px solid var(--surface); }
::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

@media (max-width: 1100px) {
  :root { --side-w: 340px; }
}
@media (max-width: 900px) {
  .app-shell { max-height: none; height: 100dvh; }
  .main-columns { grid-template-columns: 1fr; }
  .sidebar { border-right: 0; }
  .conversation-pane { display: none; }
  .app-shell.conversation-open .sidebar { display: none; }
  .app-shell.conversation-open .conversation-pane { display: flex; }
  .back-button { display: grid !important; }
  .message-scroll { padding: 18px 18px 14px; }
  .message { max-width: 82%; }
  .settings-layer { padding: 0; }
  .settings-window { width: 100%; height: 100%; }
  .settings-window-body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .settings-nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 0; }
  .settings-nav-item { width: auto; flex: none; white-space: nowrap; border-right: 1px solid var(--border); }
  .settings-nav-item.is-active { box-shadow: inset 0 -3px 0 var(--accent); }
}
@media (max-width: 700px) {
  .sidebar-top { gap: 6px; padding: 0 6px; }
  .chat-row { padding: 8px 10px; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; }
  .chat-avatar { width: 36px; height: 36px; }
  .conversation-head { height: 56px; padding: 0 8px; }
  .composer { padding: 8px 8px; }
  .composer-input { height: 38px; }
  .send-button { width: 38px; height: 38px; }
  .page-topbar { height: 56px; padding: 0 8px; }
  .page-title { font-size: 20px; }
  .page-subtitle { display: none; }
  .toast { top: 8px; left: 8px; right: 8px; width: auto; max-width: none; }
  .main-menu { left: 6px; width: calc(100% - 12px); }
  .state-menu { left: 6px; width: 220px; }
}
@media (max-width: 480px) {
  .section-head h2 { font-size: 14px; }
  .message { max-width: 90%; }
  .people-list { padding: 0 12px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="app-content" id="appContent">
    <main class="app-main" id="appMain">
      <section class="page page-chats is-active" id="page-chats">
        <h1 class="sr-only">Telegram</h1>
        <div class="main-columns">
          <aside class="sidebar" id="sidebar" aria-label="Список чатов">
            <div class="sidebar-top">
              <button class="icon-button" id="mainMenuButton" aria-label="Главное меню" aria-haspopup="menu" aria-expanded="false"><span class="icon" data-icon="menu"></span></button>
              <div class="sidebar-search">
                <span class="icon" data-icon="search" aria-hidden="true"></span>
                <label class="sr-only" for="searchInput">Поиск по чатам и сообщениям</label>
                <input id="searchInput" type="search" placeholder="Поиск" autocomplete="off">
              </div>
            </div>
            <div class="search-results" id="searchResults" aria-live="polite"></div>
            <div class="sidebar-scroll" id="sidebarScroll">
              <div id="pinnedSection">
                <div class="section-head"><h2>Закреплённые</h2></div>
                <div class="chat-list" id="pinnedChats" role="group" aria-label="Закреплённые чаты"></div>
              </div>
              <div class="section-head"><h2 id="chatsTitle">Все чаты</h2></div>
              <div class="chat-list" id="chatList" role="group" aria-label="Все чаты"></div>
            </div>
          </aside>

          <section class="conversation-pane" id="conversationPane" aria-label="Диалог">
            <header class="conversation-head">
              <button class="icon-button back-button" id="backButton" aria-label="Назад к списку чатов"><span class="icon" data-icon="back"></span></button>
              <span class="chat-avatar conversation-avatar" id="conversationAvatar">АС</span>
              <div class="conversation-title">
                <div class="conversation-name" id="conversationName">Анна Соколова</div>
                <div class="conversation-status" id="conversationStatus"><span class="status-dot"></span>в сети</div>
              </div>
              <div class="conversation-actions">
                <button class="icon-button" id="chatSearchButton" aria-label="Поиск в чате"><span class="icon" data-icon="search"></span></button>
                <button class="icon-button" id="chatCallButton" aria-label="Позвонить"><span class="icon" data-icon="call"></span></button>
                <button class="icon-button" id="chatInfoButton" aria-label="Информация о чате"><span class="icon" data-icon="info"></span></button>
                <button class="icon-button" id="chatMoreButton" aria-label="Ещё"><span class="icon" data-icon="more"></span></button>
              </div>
            </header>
            <div class="message-scroll" id="messageScroll" aria-live="polite"></div>
            <div class="attachment-chip" id="attachmentChip" hidden>
              <span class="icon" data-icon="file" aria-hidden="true"></span>
              <span id="attachmentName"></span>
              <button id="attachmentRemove" aria-label="Убрать вложение">Убрать</button>
            </div>
            <form class="composer" id="composer">
              <button class="icon-button" type="button" id="attachButton" aria-label="Прикрепить файл"><span class="icon" data-icon="attach"></span></button>
              <label class="sr-only" for="composerInput">Написать сообщение</label>
              <input class="composer-input" id="composerInput" type="text" placeholder="Написать сообщение" autocomplete="off">
              <button class="icon-button" type="button" id="emojiButton" aria-label="Эмодзи"><span class="icon" data-icon="emoji"></span></button>
              <button class="send-button" type="submit" id="sendButton" aria-label="Отправить" disabled><span class="icon" data-icon="send"></span></button>
            </form>
          </section>
        </div>
      </section>

      <section class="page page-contacts" id="page-contacts">
        <div class="page-topbar">
          <button class="icon-button" id="contactsBack" aria-label="Назад к чатам"><span class="icon" data-icon="back"></span></button>
          <h1 class="page-title">Контакты</h1>
          <span class="page-subtitle" id="contactsSubtitle">6 контактов, 3 онлайн</span>
          <button class="button primary" id="addContactButton"><span class="icon" data-icon="user" aria-hidden="true"></span>Добавить</button>
        </div>
        <div class="page-body">
          <div class="people-list">
            <div class="section-head"><h2>Онлайн</h2><span class="section-count">3</span></div>
            <div id="onlineContacts"></div>
            <div class="section-head"><h2>Все контакты</h2><span class="section-count">6</span></div>
            <div id="allContacts"></div>
          </div>
        </div>
      </section>

      <section class="page page-calls" id="page-calls">
        <div class="page-topbar">
          <button class="icon-button" id="callsBack" aria-label="Назад к чатам"><span class="icon" data-icon="back"></span></button>
          <h1 class="page-title">Звонки</h1>
          <span class="page-subtitle" id="callsSubtitle">3 пропущенных</span>
          <button class="button primary" id="newCallButton"><span class="icon" data-icon="call" aria-hidden="true"></span>Позвонить</button>
        </div>
        <div class="page-body">
          <div class="people-list">
            <div class="section-head"><h2>Недавние</h2><span class="section-count">4</span></div>
            <div id="callsList"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="main-menu" id="mainMenu" role="menu" aria-label="Главное меню">
    <button class="menu-profile" data-menu="account">
      <span class="chat-avatar tone-red" aria-hidden="true">АС</span>
      <span><span class="menu-profile-name">Анна Соколова</span><span class="menu-profile-sub">@anna</span></span>
    </button>
    <button class="menu-item" data-menu="new-group"><span class="icon" data-icon="group" aria-hidden="true"></span><span>Новая группа</span></button>
    <button class="menu-item" data-menu="new-channel"><span class="icon" data-icon="channel" aria-hidden="true"></span><span>Новый канал</span></button>
    <button class="menu-item" data-menu="contacts"><span class="icon" data-icon="user" aria-hidden="true"></span><span>Контакты</span></button>
    <button class="menu-item" data-menu="calls"><span class="icon" data-icon="call" aria-hidden="true"></span><span>Звонки</span></button>
    <button class="menu-item" data-menu="saved"><span class="icon" data-icon="bookmark" aria-hidden="true"></span><span>Избранное</span></button>
    <button class="menu-item" data-menu="archive"><span class="icon" data-icon="archive" aria-hidden="true"></span><span>Архив</span></button>
    <div class="menu-sep"></div>
    <button class="menu-item" data-menu="settings"><span class="icon" data-icon="settings" aria-hidden="true"></span><span>Настройки</span></button>
    <button class="menu-item" data-menu="demo"><span class="icon" data-icon="commands" aria-hidden="true"></span><span>Демо-состояния</span></button>
  </div>

  <div class="settings-layer" id="settingsLayer">
    <div class="settings-window" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-head">
        <h2 class="settings-title" id="settingsTitle">Настройки</h2>
        <button class="settings-close" id="settingsClose" aria-label="Закрыть настройки"><span class="icon" data-icon="close"></span></button>
      </div>
      <div class="settings-window-body">
        <nav class="settings-nav" id="settingsNav" aria-label="Разделы настроек"></nav>
        <div class="settings-content" id="settingsBody"></div>
      </div>
    </div>
  </div>

  <div class="modal-layer" id="modalLayer">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">Новая группа</h2>
        <button class="modal-close" id="modalClose" aria-label="Закрыть"><span class="icon" data-icon="close"></span></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button class="button secondary" id="modalCancel">Отмена</button>
        <button class="button primary" id="modalPrimary" hidden>Создать</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true">
    <div class="toast-head">
      <span class="toast-avatar tone-red" id="toastAvatar">АС</span>
      <span class="toast-title" id="toastTitle">Анна Соколова</span>
      <button class="toast-close" id="toastClose" aria-label="Закрыть уведомление"><span class="icon" data-icon="close"></span></button>
    </div>
    <div class="toast-body" id="toastBody">Отправила файл «Макет.pdf»</div>
    <div class="toast-actions"><button class="button secondary small" id="toastAction">Ответить</button></div>
  </div>

  <div class="state-menu" id="stateMenu" role="menu" aria-label="Демо-состояния">
    <div class="state-menu-head">Демо-состояния</div>
    <button data-state="populated" role="menuitem">Заполненные данные</button>
    <button data-state="loading" role="menuitem">Загрузка</button>
    <button data-state="empty" role="menuitem">Пустой список</button>
    <button data-state="error" role="menuitem">Ошибка загрузки</button>
    <button data-demo="toast" role="menuitem">Показать уведомление</button>
    <button data-demo="splash" role="menuitem">Показать splash</button>
    <button data-demo="reset" role="menuitem">Сбросить демо</button>
  </div>

  <div class="splash" id="splash" aria-hidden="true">
    <span class="splash-mark icon" data-icon="send" aria-hidden="true"></span>
    <div class="splash-title">Telegram</div>
    <div class="splash-sub">Windows UI prototype</div>
    <div class="splash-bar"></div>
  </div>
</div>

<script>
const icons = {

  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5 9 8l-2 1.5c.7 2.3 1.7 3.3 4 4L12.5 11l4.5 2.5c.3 1.8-.8 3.2-2.5 3.5C8.8 18 4.5 13.7 3.5 8c-.3-1.7 1.2-2.8 3-2.5Z"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r="1"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>',
  warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5"/><circle cx="12" cy="17.5" r="1"/></svg>',

  database: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',

function icon(name) { return '<span class="icon" aria-hidden="true">' + (icons[name] || '') + '</span>'; }
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s])); }
function initials(name) { const parts = String(name).trim().split(/\s+/).filter(Boolean); return ((parts[0] || '?')[0] || '?') + ((parts[1] || '')[0] || ''); }
function formatTime() { return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
function formatSize(bytes) {
  if (!bytes) return '0 Б';
  const units = ['Б', 'КБ', 'МБ', 'ГБ'];
  let n = bytes, i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0).replace('.', ',') + ' ' + units[i];
}

  const newChat = { id: 'new-' + Date.now(), name: name, avatar: initials(name), tone: 'blue', type: 'personal', online: !!person && person.online, preview: 'Новый чат', time: 'сейчас', unread: 0, messages: [] };

  switchPage('chats');
  renderPinnedChats();
  renderChatList();

function settingsHelp() { return '<div class="settings-section"><h3>Горячие клавиши</h3><dl class="shortcut-list"><div><dt>Поиск</dt><dd><kbd>Ctrl</kbd> + <kbd>K</kbd></dd></div><div><dt>Настройки</dt><dd><kbd>Ctrl</kbd> + <kbd>,</kbd></dd></div><div><dt>Главное меню</dt><dd><kbd>Ctrl</kbd> + <kbd>M</kbd></dd></div><div><dt>Закрыть окно</dt><dd><kbd>Esc</kbd></dd></div><div><dt>Отправить сообщение</dt><dd><kbd>Enter</kbd></dd></div></dl></div><div class="settings-section"><h3>Что можно сделать</h3><p class="settings-copy">Откройте чат, найдите сообщение через поиск, переключите тему или плотность интерфейса. Все действия работают локально в прототипе.</p></div>'; }
function settingsAbout() { return '<div class="settings-section"><h3>Telegram Desktop</h3><p class="settings-copy">Версия 7.4.4. Демо-прототип интерфейса в стиле Windows Store. Не подключён к Telegram API и не отправляет сообщения.</p><p class="settings-note">Сборка: 24.11.2026. Платформа: Windows x64.</p></div><div class="settings-section"><h3>Компоновка</h3><p class="settings-copy">Расположение кнопок повторяет официальный клиент: меню и поиск в левой колонке, действия чата в шапке диалога, вложение, эмодзи и отправка в composer.</p></div>'; }
function settingsGeneric(id) {

  if (id === 'notifications') return '<div class="settings-section"><h3>Уведомления</h3><div class="toggle-row"><span>Показывать уведомления</span><input type="checkbox" checked><span class="toggle"></span></div><div class="toggle-row"><span>Звук</span><input type="checkbox" checked><span class="toggle"></span></div><div class="toggle-row"><span>Показывать текст сообщения</span><input type="checkbox"><span class="toggle"></span></div></div>';
  if (id === 'privacy') return '<div class="settings-section"><h3>Приватность</h3><div class="toggle-row"><span>Последняя активность</span><input type="checkbox" checked><span class="toggle"></span></div><div class="toggle-row"><span>Звонки</span><input type="checkbox" checked><span class="toggle"></span></div><div class="toggle-row"><span>Пересылка сообщений</span><input type="checkbox"><span class="toggle"></span></div></div>';

function renderSettings(section = 'account') {
  settingsSection = section;

  scrollActiveSettingsNav();
  if (section === 'appearance') settingsBody.innerHTML = settingsAppearance();
  else if (section === 'help') settingsBody.innerHTML = settingsHelp();
  else if (section === 'about') settingsBody.innerHTML = settingsAbout();
  else settingsBody.innerHTML = settingsGeneric(section);

function scrollActiveSettingsNav() {
  if (!window.matchMedia('(max-width: 900px)').matches) return;

  if (active) settingsNav.scrollLeft = Math.max(0, active.offsetLeft - 12);

function updateInert() { const blocked = settingsLayer.classList.contains('is-open') || modalLayer.classList.contains('is-open'); appContent.inert = blocked; }
function openSettings(section = 'account') { closeMainMenu(); closeStateMenu(); lastFocused = document.activeElement; settingsLayer.classList.add('is-open'); renderSettings(section); updateInert(); document.getElementById('settingsClose').focus(); }
function closeSettings() { settingsLayer.classList.remove('is-open'); updateInert(); if (lastFocused && document.contains(lastFocused) && lastFocused.offsetParent !== null) lastFocused.focus(); else mainMenuButton.focus(); }
function setTheme(theme) { document.documentElement.dataset.theme = theme; try { localStorage.setItem('tg-theme', theme); } catch (e) {} const appearance = settingsSections.find(s => s.id === 'appearance'); if (appearance) appearance.sub = (theme === 'dark' ? 'Тёмная' : 'Светлая') + ' тема, ' + (currentDensity() === 'compact' ? 'компактная' : 'комфортная') + ' плотность'; if (settingsSection === 'appearance') renderSettings('appearance'); }
function setDensity(density) { document.documentElement.dataset.density = density; try { localStorage.setItem('tg-density-v3', density); } catch (e) {} const appearance = settingsSections.find(s => s.id === 'appearance'); if (appearance) appearance.sub = (currentTheme() === 'dark' ? 'Тёмная' : 'Светлая') + ' тема, ' + (density === 'compact' ? 'компактная' : 'комфортная') + ' плотность'; if (settingsSection === 'appearance') renderSettings('appearance'); }
function showToast(title, body, actionLabel, action, avatar = 'АС', tone = 'red') { toastTitle.textContent = title; toastBody.textContent = body; toastAvatar.className = 'toast-avatar tone-' + tone; toastAvatar.textContent = avatar; toastAction.hidden = !actionLabel; toastAction.textContent = actionLabel || ''; toastAction.onclick = () => { if (action) action(); hideToast(); }; toast.classList.add('is-visible'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 7000); }
function hideToast() { toast.classList.remove('is-visible'); clearTimeout(toastTimer); }
function showSplash() { splash.classList.remove('is-hidden'); splash.setAttribute('aria-hidden', 'false'); clearTimeout(splashTimer); splashTimer = setTimeout(() => { splash.classList.add('is-hidden'); splash.setAttribute('aria-hidden', 'true'); }, 1500); }
function openModal(type) {
  closeMainMenu(); closeStateMenu(); modalType = type; lastFocused = document.activeElement; modalPrimary.hidden = true; modalPrimary.disabled = false;

  modalPrimary.hidden = false; modalPrimary.textContent = 'Создать'; modalPrimary.disabled = true;

    chatData.unshift(newChat); renderPinnedChats(); renderChatList(); selectChat(newChat.id, { openDetail: true }); closeModal(); showToast('Готово', (isGroup ? 'Группа' : 'Канал') + ' «' + value + '» создан.', 'Открыть', () => selectChat(newChat.id, { openDetail: true }), newChat.avatar, newChat.tone);

function closeModal() { modalLayer.classList.remove('is-open'); updateInert(); modalPrimary.onclick = null; if (lastFocused && document.contains(lastFocused) && lastFocused.offsetParent !== null) lastFocused.focus(); else mainMenuButton.focus(); }
function closeTopLayer() { if (modalLayer.classList.contains('is-open')) { closeModal(); return true; } if (settingsLayer.classList.contains('is-open')) { closeSettings(); return true; } if (stateMenu.classList.contains('is-open')) { closeStateMenu(); return true; } if (mainMenu.classList.contains('is-open')) { closeMainMenu(); return true; } if (searchResults.classList.contains('is-open')) { closeSearch(); return true; } if (appShell.classList.contains('conversation-open')) { backToList(); return true; } return false; }

document.querySelectorAll('[data-icon]').forEach(el => { const name = el.getAttribute('data-icon'); if (icons[name]) el.innerHTML = icons[name]; });
const storedTheme = (() => { try { return localStorage.getItem('tg-theme'); } catch (e) { return null; } })();
const storedDensity = (() => { try { return localStorage.getItem('tg-density-v3'); } catch (e) { return null; } })();
const params = new URLSearchParams(location.search);

document.getElementById('emojiButton').addEventListener('click', () => { const start = composerInput.selectionStart || composerInput.value.length; const end = composerInput.selectionEnd || composerInput.value.length; composerInput.value = composerInput.value.slice(0, start) + '🙂' + composerInput.value.slice(end); composerInput.focus(); composerInput.selectionStart = composerInput.selectionEnd = start + 2; updateSendState(); });
document.getElementById('attachmentRemove').addEventListener('click', () => { pendingAttachment = null; renderAttachmentChip(); updateSendState(); });
document.getElementById('toastClose').addEventListener('click', hideToast);
toast.addEventListener('mouseenter', () => clearTimeout(toastTimer));
